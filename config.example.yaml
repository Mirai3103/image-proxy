# Listening on all interfaces with no authentication is appropriate only on a
# trusted LAN. Do not expose this proxy to the public internet.
proxy:
  host: 0.0.0.0
  port: 8080

matching:
  # HTTPS is decrypted only for these hostname globs. Within those hosts, a
  # request must also match at least one full-URL regex below.
  domains:
    - "*.example-cdn.com"
  url_regex:
    - "/manga/"
    - "\\.(jpe?g|webp)(\\?|$)"

processing:
  # Ordered pipeline of image stages. Allowed values: "watermark",
  # "translate", "upscale". "watermark" cannot combine with others. When both
  # "translate" and "upscale" are present, "translate" must come first.
  # Examples:
  #   pipeline: ["watermark"]
  #   pipeline: ["upscale"]
  #   pipeline: ["translate"]
  #   pipeline: ["translate", "upscale"]
  pipeline:
    - "translate"
    - "upscale"
  text: "UPSCALED"
  jpeg_quality: 90
  webp_quality: 90
  max_source_mb: 30
  max_pixels: 80000000
  workers: 1
  # Required when pipeline includes "translate" (koharu-server `/translate`).
  koharu:
    server_url: "http://127.0.0.1:8383"
    timeout_seconds: 120
  # Required when pipeline includes "upscale" (ComfyUI upscale workflow).
  comfyui:
    server_url: "http://127.0.0.1:8188"
    model_name: "2x-AnimeSharpV3.pth"
    timeout_seconds: 45


cache:
  directory: "./data/cache"
  ttl_hours: 168
  max_size_gb: 10
  low_watermark_ratio: 0.90
  cleanup_interval_minutes: 10
  eviction_batch_size: 25
